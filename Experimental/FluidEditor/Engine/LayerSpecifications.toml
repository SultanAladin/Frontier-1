#-------------------------------------------------------------------------------------------------------------------------------------------
# Particle cloud layers (phase 3). Target Particles = the particle system node the GPU reads. Neutral = what the shaders see with no layer
# of that category (no gravity, no drag, no force-field response, pass through the floor). Timing (start, duration, fade, repeat) stays on
# the node until phase 4 turns it into a keyed Weight track. Sizes are metres when Size units = World, pixels when Pixels.
#-------------------------------------------------------------------------------------------------------------------------------------------

