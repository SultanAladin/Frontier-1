#===========================================================================================================================================
#                                                       LAYERSPECIFICATIONS.TOML
#===========================================================================================================================================
# 🧩 Single source of truth for every effect layer (Fluid layer stack plan, phase 1). GenerateLayerSpecifications.mjs turns this file into
# Engine/LayerSpecifications.js for the browser; the C++ port is generated from the same file later. Edit this file, never the output.
#
# Rules (plan §3.1): one of 9 parameter types; Choice codes are explicit and never list positions; SI units; Neutral is the amount the
# solver sees when no enabled layer of the category exists; Target names the evaluated block (Domain = solver, Volume = volume render).
# Category codes: 1xx gas volume (101–108), 2xx particle cloud (201–212). Layer and parameter codes are permanent once released.

[Document]
Format = "frontier-layer-specifications"
Revision = 1
MaximumLayers = 32

