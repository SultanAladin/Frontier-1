<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowBox — Top-Down Level Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Editor.css" />
  </head>
  <body>
    <main class="workspace" id="workspace" style="--left: 302px; --right: 336px">
      <section class="dock left" aria-label="Outliner dock">
        <div class="tab-strip">
          <div class="document-tab active">Outliner</div>
        </div>
        <div class="panel-body outliner" id="outliner"></div>
        <div class="divider left" data-side="left" role="separator" aria-orientation="vertical" aria-label="Resize outliner"></div>
      </section>

      <section class="dock centre" aria-label="Viewport dock">
        <div class="tab-strip">
          <div class="document-tab active">Viewport</div>
        </div>
        <div class="viewport-toolbar" id="toolbar"></div>
        <div class="viewport" id="viewport"></div>
        <div class="viewport-footer" id="status"></div>
      </section>

      <section class="dock right" aria-label="Inspector dock">
        <div class="tab-strip">
          <div class="document-tab active">Inspector</div>
        </div>
        <div class="panel-body inspector-scroll" id="inspector"></div>
        <div class="inspector-footer" id="inspector-footer"></div>
        <div class="divider right" data-side="right" role="separator" aria-orientation="vertical" aria-label="Resize inspector"></div>
      </section>
    </main>

    <div class="notch-shell" id="notch-shell">
      <div class="shade" id="notch-shade">
        <div class="control-dashboard" id="notch-dashboard" role="dialog" aria-label="Level file actions"></div>
      </div>
      <button class="notch-handle" id="notch-handle" aria-expanded="false" aria-controls="notch-dashboard">
        <svg viewBox="0 0 200 36" aria-hidden="true">
          <path d="M0 0 H200 V6 L170 36 H30 L0 6 Z" />
        </svg>
        <span>ShadowBox</span>
      </button>
    </div>

    <div class="drawer-shell bottom" id="drawer-shell">
      <div class="drawer-surface" id="drawer-surface" aria-label="Prop Library"></div>
      <button class="drawer-handle" id="drawer-handle" aria-expanded="false" aria-controls="drawer-surface">
        <svg viewBox="0 0 200 36" aria-hidden="true">
          <path d="M30 0 H170 L200 36 H0 Z" />
        </svg>
        <span>Prop Library</span>
      </button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept="application/json,.json" hidden />
    <script type="module" src="js/main.js"></script>
  </body>
</html>
