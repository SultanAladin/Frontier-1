<style>
  :root { --bg:#0d1017; --card:#151a24; --border:#273043; --text:#e5ebf5; --muted:#8c9bb5; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; background:rgba(13,16,23,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); padding:14px 22px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input[type=search] { background:#111622; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; width:230px; font-size:13px; }
  .pill { background:#182030; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .pill.active { background:var(--accent); border-color:var(--accent); color:#09101a; font-weight:600; }
  main { padding:20px 22px 48px; display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .14s ease, border-color .14s ease; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:#090b10; }
  .info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .name { font-weight:600; font-size:14px; }
  .badge { font-size:11px; color:#9ecbff; background:#1a283d; border:1px solid #2b4263; border-radius:6px; padding:1px 7px; white-space:nowrap; }
  .meta { font-size:11px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .summary { font-size:12px; color:#b8c4d9; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .modal { position:fixed; inset:0; background:rgba(5,7,11,.84); display:none; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .modal.open { display:flex; }
  .dialog { background:#121722; border:1px solid var(--border); border-radius:14px; width:min(1100px, 96vw); max-height:90vh; display:grid; grid-template-columns:1.1fr 1fr; overflow:hidden; }
  @media (max-width:860px) { .dialog { grid-template-columns:1fr; overflow:auto; } }
  .left { padding:18px; display:flex; flex-direction:column; gap:12px; background:#0e121b; }
  .left img { width:100%; border-radius:10px; border:1px solid var(--border); }
  .right { display:flex; flex-direction:column; min-height:0; border-left:1px solid var(--border); }
  .right-hdr { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  pre { margin:0; padding:14px 16px; overflow:auto; font-size:12px; line-height:1.45; color:#cde0ff; background:#0b0e15; flex:1; }
  button.close { background:#232d40; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 11px; cursor:pointer; }
</style>

const FAMILIES = ["All", ...Array.from(new Set(PRESETS.map(p => p.family)))];
let activeFam = "All";

const pillsEl = document.getElementById("pills");
FAMILIES.forEach(f => {
  const b = document.createElement("button");
  b.className = "pill" + (f === activeFam ? " active" : "");
  b.textContent = f;
  b.onclick = () => { activeFam = f; render(); };
  pillsEl.appendChild(b);
});

const qEl = document.getElementById("q");
qEl.oninput = render;

function render() {
  Array.from(pillsEl.children).forEach(b => b.classList.toggle("active", b.textContent === activeFam));
  const q = qEl.value.trim().toLowerCase();
  const list = PRESETS.filter(p => {
    if (activeFam !== "All" && p.family !== activeFam) return false;
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) ||
           p.summary.toLowerCase().includes(q) || p.file.toLowerCase().includes(q);
  });
  document.getElementById("count").textContent = `(${list.length}/54)`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openModal(p);
    card.innerHTML = `
      <img loading="lazy" src="presets/${p.id}.png" alt="${p.name}"/>
      <div class="info">
        <div class="top"><div class="name">#${String(p.order).padStart(2,'0')} ${p.name}</div><span class="badge">${p.family}</span></div>
        <div class="meta">${p.emitters}E · ${p.forces}F · ${p.colliders}C · ${p.particles}P · ${p.file}</div>
        <div class="summary">${p.summary}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function openModal(p) {
  document.getElementById("mImg").src = `presets/${p.id}.png`;
  document.getElementById("mTitle").textContent = `#${String(p.order).padStart(2,'0')} ${p.name}`;
  document.getElementById("mFam").textContent = p.family;
  document.getElementById("mMeta").textContent = `${p.id} · ${p.emitters} Emitters · ${p.forces} Forces · ${p.colliders} Colliders · ${p.particles} Particle Clouds`;
  document.getElementById("mSum").textContent = p.summary;
  document.getElementById("mFile").textContent = `EngineContent/Simulation/Presets/${p.file}`;
  document.getElementById("mToml").textContent = p.toml;
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
window.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
render();
</script>
