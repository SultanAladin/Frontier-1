name: Windows desktop package

# Builds FrontierUV.exe and FrontierEditor.exe with MSVC, packages them with shaders and content, and attaches
# verifiable provenance. Authenticode signing runs only when a certificate is configured (see
# Documentation/Plans/UVWorkspaceAuditAndWindowsPackaging.md).

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
    paths:
      - '.github/workflows/windows-desktop-package.yml'
      - 'CMakeLists.txt'
      - 'Automation/**'
      - 'Engine/**'
      - 'EngineContent/**'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish the package as a GitHub pre-release (downloadable .zip with attestation)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-package-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: FrontierUV-Windows-x64
  PYTHONUTF8: '1'

jobs:
  windows-package:
    name: Windows x64 MSVC package
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write        # pre-release publication (workflow_dispatch input only)
      id-token: write        # Sigstore identity for build provenance
      attestations: write    # store the provenance attestation on the repository
    steps:
      - name: Check out branch source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Audit UV workspace banned vocabulary
        run: python Automation/AuditBannedVocabulary.py

      - name: Recover pinned dependencies, fonts and shader compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --requirement Automation/FontRequirements.txt
          python Automation/PrepareDependencies.py
          python Automation/PrepareFonts.py
          python Automation/PrepareShaderToolchain.py

      - name: Configure Editor profile (MSVC x64, static runtime)
        run: >
          cmake -S . -B Build/Windows -G "Visual Studio 17 2022" -A x64
          -DFRONTIER_PROFILE=Editor
          -DBUILD_TESTING=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build FrontierUV, FrontierEditor and the CPU-only UV boundary validation
        shell: pwsh
        env:
          CL: /MP
        run: |
          # UVBoundaryValidation is the only validation exhibit with no Vulkan, window, or font dependency,
          # so it is the one suite that can run on a runner without a graphics driver.
          cmake --build Build/Windows --config Release --target FrontierUV FrontierEditor UVBoundaryValidation --parallel 4 2>&1 | Tee-Object -FilePath Build/Windows/BuildOutput.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Surface compiler diagnostics on failure
        if: failure()
        shell: python
        run: |
          # Workflow logs are not reachable from every review environment, so compiler errors are repeated as annotations.
          import pathlib, re
          LogPath = pathlib.Path('Build/Windows/BuildOutput.log')
          Lines = LogPath.read_text(encoding='utf-8', errors='replace').splitlines() if LogPath.exists() else ['Build log was not produced.']
          Seen, Errors = set(), []
          for Line in Lines:
              if not re.search(r'(error|fatal error) [A-Z]+\d+|: error', Line):
                  continue
              Line = re.sub(r'\s*\[[A-Za-z]:\\[^\]]*\.vcxproj\]\s*$', '', Line.strip())
              Line = re.sub(r'^[A-Za-z]:\\a\\[^\\]+\\[^\\]+\\', '', Line)
              if Line not in Seen:
                  Seen.add(Line)
                  Errors.append(Line)
          Chunk, Size, Part = [], 0, 1
          def Flush():
              global Chunk, Size, Part
              if Chunk and Part <= 9:
                  Body = '\n'.join(Chunk).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=MSVC diagnostics {0} ({1} unique errors)::{2}'.format(Part, len(Errors), Body))
                  Part += 1
              Chunk, Size = [], 0
          for Line in Errors:
              Line = Line[:420]
              if Size + len(Line) > 7000:
                  Flush()
              Chunk.append(Line)
              Size += len(Line) + 1
          Flush()

      - name: Run CPU-only UV boundary validation
        shell: pwsh
        run: |
          ctest --test-dir Build/Windows -C Release --output-on-failure -R '^UVBoundaryValidation$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect relocatable package folder
        run: >
          python Automation/PackageDesktopBinaries.py --collect
          --build-dir Build/Windows
          --package-dir Build/Package/${{ env.PACKAGE_NAME }}
          --repository ${{ github.repository }}
          --revision ${{ github.sha }}

      - name: Verify packaged layout from a foreign working directory
        shell: pwsh
        run: |
          $Package = Resolve-Path "Build/Package/$env:PACKAGE_NAME"
          Push-Location $env:RUNNER_TEMP
          foreach ($Executable in Get-ChildItem "$Package\*.exe") {
            $Report = (& $Executable.FullName --verify-packaged-layout 2>&1 | Out-String).Trim()
            $ExitCode = $LASTEXITCODE
            Write-Output $Report
            if ($ExitCode -ne 0) {
              $Escaped = $Report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$($Executable.Name) packaged layout (exit $ExitCode)::$Escaped"
              throw "$($Executable.Name) failed packaged layout verification"
            }
          }
          Pop-Location

      - name: Report runtime library dependencies
        shell: pwsh
        run: |
          $Dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          & $Dumpbin.FullName /dependents "Build/Package/$env:PACKAGE_NAME/FrontierUV.exe"

      - name: Authenticode-sign executables (only when a certificate is configured)
        id: authenticode
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERTIFICATE_BASE64)) {
            Write-Output "::notice title=Unsigned build::No WINDOWS_SIGNING_CERTIFICATE_BASE64 secret is configured. Executables carry build provenance but no Authenticode signature, so browsers and SmartScreen may still show a reputation prompt."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $CertificatePath = Join-Path $env:RUNNER_TEMP 'signing-certificate.pfx'
          [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          try {
            $SignTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $Executables = (Get-ChildItem "Build/Package/$env:PACKAGE_NAME/*.exe").FullName
            & $SignTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $CertificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD /d "Frontier UV" $Executables
            if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed' }
            & $SignTool.FullName verify /pa /v $Executables
            if ($LASTEXITCODE -ne 0) { throw 'signtool verify failed' }
          }
          finally {
            Remove-Item $CertificatePath -Force
          }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Record digests and compress bundle
        shell: pwsh
        run: |
          $SignedArgument = @()
          if ('${{ steps.authenticode.outputs.signed }}' -eq 'true') { $SignedArgument = @('--authenticode-signed') }
          python Automation/PackageDesktopBinaries.py --bundle --package-dir "Build/Package/$env:PACKAGE_NAME" @SignedArgument
          Get-Content "Build/Package/$env:PACKAGE_NAME/SHA256SUMS.txt" | Select-String '\.exe$' | ForEach-Object { $_.Line } >> $env:GITHUB_STEP_SUMMARY

      - name: Summarize package contents
        shell: pwsh
        run: |
          $Package  = "Build/Package/$env:PACKAGE_NAME"
          $Manifest = Get-Content "$Package/PackageManifest.json" -Raw | ConvertFrom-Json
          $Rows = foreach ($Executable in Get-ChildItem "$Package/*.exe") {
            $Digest = (Get-FileHash $Executable.FullName -Algorithm SHA256).Hash.ToLower()
            '- `{0}` - {1:N1} MiB - SHA-256 `{2}`' -f $Executable.Name, ($Executable.Length / 1MB), $Digest
          }
          $SignatureNote = if ($Manifest.AuthenticodeSigned) { 'Authenticode signed' } else { 'unsigned (no certificate configured)' }
          @(
            '### Frontier UV Windows x64 package',
            '',
            "- Shaders: $($Manifest.ShaderBinaryCount)",
            "- Code signature: $SignatureNote",
            "- Source revision: $($Manifest.Revision)",
            ''
          ) + $Rows | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $Manifest.AuthenticodeSigned) {
            Write-Output "::warning title=Unsigned preview build::Browsers and Windows SmartScreen may show a reputation prompt for these executables. Provenance is verifiable with: gh attestation verify FrontierUV.exe --repo ${{ github.repository }}"
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            Build/Package/${{ env.PACKAGE_NAME }}/*.exe
            Build/Package/${{ env.PACKAGE_NAME }}.zip

      - name: Upload package (GitHub delivers this as one .zip)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: Build/Package/${{ env.PACKAGE_NAME }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "preview-$('${{ github.sha }}'.Substring(0, 10))"
          gh release create $Tag "Build/Package/$env:PACKAGE_NAME.zip" --prerelease --target ${{ github.sha }} --title "Frontier UV Windows preview $Tag" --notes "Verify with: gh attestation verify $env:PACKAGE_NAME.zip --repo ${{ github.repository }}"
